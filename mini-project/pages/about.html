<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ghép</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css">
</head>
<body>
    <header>
        <nav class="menu">
            <div class="menu-container">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/24/LEGO_logo.svg/3840px-LEGO_logo.svg.png" width="50px" alt="logo">
                <a class="menu homepage" href="../index.html">Trang chủ</a>
                <a class="menu products" href="products.html">Sản phẩm</a>
                <a class="menu about" href="about.html">Giới thiệu</a>
                <a class="menu contact" href="contact.html">Liên hệ</a>
                <a class="menu login" href="login.html">Đăng nhập</a>
            </div>
        </nav>
    </header>

    <main class="content">
        <img src="https://www.lego.com/cdn/cs/set/assets/blt03df11be976d5b95/bltabca17664d3d9eee-Home_EX-SKU-2025XX-Home-PS-Hero-Standard-Large.jpg?format=webply&fit=crop&quality=75&width=1600&height=500&dpr=1" width="1520px" alt="background">
        <section class="items-product">

            <article class="item-1">
                 <div class="new">
                    <p>New</p>
                </div>
                <img src="https://www.lego.com/cdn/cs/set/assets/blt91b18dbcb302f294/43022_Prod.png?format=webply&fit=bounds&quality=100&width=250&height=250&dpr=1" alt="sản phẩm 1">
                <div class="name-item-1">
                    <h3>Mũ bảo hiểm lego</h3>
                </div>
                <div class="price">
                    <p>$89.99</p>
                </div>
                <div class="add-to-bag">
                    <button class="btn btn-cart">
                        <span class="mdi mdi-cart-outline"></span>
                    </button>
                    <button class="btn btn-heart">
                        <span class="mdi mdi-heart-outline"></span>
                    </button>
                </div>
            </article>

            <article class="item-2">
                <div class="new">
                    <p>New</p>
                </div>
                <img src="https://www.lego.com/cdn/cs/set/assets/blt278340680c8d7955/72151_Prod.png?format=webply&fit=bounds&quality=100&width=250&height=250&dpr=1" alt="sản phẩm 2">
                <div class="name-item-2">
                    <h3>Eevee</h3>
                </div>
                <div class="price">
                    <p>$59.99</p>
                </div>
                <div class="add-to-bag">
                    <button class="btn btn-cart">
                        <span class="mdi mdi-cart-outline"></span>
                    </button>
                    <button class="btn btn-heart">
                        <span class="mdi mdi-heart-outline"></span>
                    </button>
                </div>
            </article>

            <article class="item-3">
                <div class="new">
                    <p>New</p>
                </div>
                <img src="https://www.lego.com/cdn/cs/set/assets/blt48d40387c8ddf5ca/blt69f537b34c0b5ee2-43301_Prod_en-gb.png?format=webply&fit=bounds&quality=100&width=250&height=250&dpr=1" alt="sản phẩm 3">
                <div class="name-item-2">
                    <h3>Toy story slinky Bookends</h3>
                </div>
                <div class="price">
                    <p>$149.99</p>
                </div>
                <div class="add-to-bag">
                    <button class="btn btn-cart">
                        <span class="mdi mdi-cart-outline"></span>
                    </button>
                    <button class="btn btn-heart">
                        <span class="mdi mdi-heart-outline"></span>
                    </button>
                </div>
            </article>

        </section>
    </main>
</body>
</html>
