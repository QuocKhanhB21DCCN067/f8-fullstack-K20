<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="background">
    <div class="comment-box">

      <div class="content-box-1">
        <img class="avatar" src="avatar.jpg" width="50" alt="">
        <span class="name">Peter Williams</span>
        <div class="rate">
          <span class="number-star" >5</span>
          <img class="star" src="star.svg" width="13" alt="">
        </div>
        <img class="tick" src="tick-circle.svg" width="20" alt="">
        <span class="verified">Verified order</span>
      </div>    

      <div class="content-box-2">
        <span>The food was fresh, delicious, and beautifully presented. The service was quick, and the vegan options were a delightful surprise.</span>
      </div>

      <div class="content-box-3">
        <span>2 months ago</span>
      </div>

      <div class="content-box-4">

        <div class="row-1">
        </div>
        <div class="row-2">
        </div>

        <span class="rate-row">4.5/5</span>

        <img class="star-row-2" src="star-orange.svg" width="15" alt="">
      </div>
      
    </div>
  </div>

</body>
</html>
